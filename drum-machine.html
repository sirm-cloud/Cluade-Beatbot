        // Don't allow editing while playing in song mode
        if (this.machine.songMode && this.machine.isPlaying) {
          return;
        }

        const ch = parseInt(e.target.dataset.channel);
        const step = parseInt(e.target.dataset.step);

        if (this.machine.channels[ch].steps[step]) {
          this.machine.channels[ch].steps[step] = null;
          e.target.classList.remove('active');
          e.target.style.opacity = '';
        } else {
          this.machine.channels[ch].steps[step] = 0.8;
          e.target.classList.add('active');
          e.target.style.opacity = 0.8;
        }

        this.machine.savePattern(this.machine.currentPattern);
      }
    };

    document.getElementById('channelsContainer').onclick = (e) => {
      if (e.target.classList.contains('solo-btn')) {
        const ch = parseInt(e.target.dataset.channel);
        this.machine.channels[ch].solo = !this.machine.channels[ch].solo;
        e.target.classList.toggle('active');
      }

      if (e.target.classList.contains('mute-btn')) {
        const ch = parseInt(e.target.dataset.channel);
        this.machine.channels[ch].mute = !this.machine.channels[ch].mute;
        e.target.classList.toggle('active');
      }
    };

    document.getElementById('channelsContainer').oninput = (e) => {
      if (e.target.classList.contains('param-slider')) {
        const ch = parseInt(e.target.dataset.channel);
        const param = e.target.dataset.param;
        let value = parseFloat(e.target.value);

        if (param === 'volume' || param === 'decay' || param === 'reverbSend' || param === 'delaySend') {
          value = value / 100;
        } else if (param === 'pan') {
          value = value / 100;
        }

        this.machine.channels[ch][param] = value;
      }
    };

    document.getElementById('patternGrid').onclick = (e) => {
      if (e.target.classList.contains('pattern-btn')) {
        const idx = parseInt(e.target.dataset.pattern);
        this.machine.savePattern(this.machine.currentPattern);
        this.machine.loadPattern(idx);
        this.renderSequencer();
        this.renderPatternBank();
        document.getElementById('currentPattern').textContent = e.target.textContent;
      }
    };

    document.getElementById('reverbMix').oninput = (e) => {
      this.machine.reverbGain.gain.value = e.target.value / 100;
    };

    document.getElementById('delayMix').oninput = (e) => {
      this.machine.delayMix.gain.value = e.target.value / 100;
    };

    document.getElementById('delayFeedback').oninput = (e) => {
      this.machine.delayFeedback.gain.value = e.target.value / 100;
    };

    // Compressor controls
    document.getElementById('compressorOn').onchange = (e) => {
      this.machine.compressorEnabled = e.target.checked;
      this.machine.compressor.ratio.value = e.target.checked ? this.machine.compressorRatio : 1;
    };

    document.getElementById('compThreshold').oninput = (e) => {
      const value = parseInt(e.target.value);
      this.machine.compressorThreshold = value;
      this.machine.compressor.threshold.value = value;
      document.getElementById('compThresholdValue').textContent = value + ' dB';
    };

    document.getElementById('compRatio').oninput = (e) => {
      const value = parseInt(e.target.value);
      this.machine.compressorRatio = value;
      if (this.machine.compressorEnabled) {
        this.machine.compressor.ratio.value = value;
      }
      document.getElementById('compRatioValue').textContent = value + ':1';
    };

    let dragging = false;
    const fader = document.getElementById('masterFader');
    const track = fader.parentElement;

    fader.onmousedown = () => dragging = true;
    document.onmouseup = () => dragging = false;
    document.onmousemove = (e) => {
      if (dragging) {
        const rect = track.getBoundingClientRect();
        let y = e.clientY - rect.top;
        y = Math.max(0, Math.min(rect.height - 30, y));
        fader.style.top = y + 'px';

        const value = 1 - (y / (rect.height - 30));
        this.machine.masterGain.gain.value = value * 0.8;
      }
    };

    document.getElementById('exportWav').onclick = async () => {
      const btn = document.getElementById('exportWav');
      try {
        btn.textContent = 'Rendering...';
        btn.disabled = true;
        await this.machine.exportWAV();
      } finally {
        btn.textContent = 'WAV';
        btn.disabled = false;
      }
    };
    document.getElementById('exportMidi').onclick = () => this.machine.exportMIDI();
    document.getElementById('saveProject').onclick = () => this.machine.saveProject();
    document.getElementById('loadProject').onclick = () => this.machine.loadProject();

    document.getElementById('copyPattern').onclick = () => {
      if (this.machine.copyPattern()) {
        document.getElementById('copyPattern').textContent = 'Copied!';
        setTimeout(() => {
          document.getElementById('copyPattern').textContent = 'Copy';
        }, 1000);
      }
    };

    document.getElementById('pastePattern').onclick = () => {
      if (this.machine.pastePattern()) {
        this.renderSequencer();
        document.getElementById('pastePattern').textContent = 'Pasted!';
        setTimeout(() => {
          document.getElementById('pastePattern').textContent = 'Paste';
        }, 1000);
      } else {
        alert('No pattern copied yet! Copy a pattern first.');
      }
    };

    document.getElementById('clearPattern').onclick = () => {
      if (confirm('Clear current pattern?')) {
        this.machine.channels.forEach(ch => {
          ch.steps = Array(16).fill(null);
        });
        this.machine.savePattern(this.machine.currentPattern);
        this.renderSequencer();
      }
    };
  }

  updatePlayhead() {
    const steps = document.querySelectorAll('.step');
    steps.forEach((step, idx) => {
      const stepNum = idx % 16;
      if (stepNum === this.machine.currentStep) {
        step.classList.add('current-step');
      } else {
        step.classList.remove('current-step');
      }
    });

    // Update song chain playing indicator and pattern display
    if (this.machine.songMode) {
      this.renderSongChain();

      // Re-render sequencer when pattern changes in song mode
      if (this.machine.patternChanged) {
        this.machine.patternChanged = false;
        this.renderSequencer();

        // Update pattern indicator
        const labels = ['A1', 'A2', 'A3', 'A4', 'B1', 'B2', 'B3', 'B4',
                        'C1', 'C2', 'C3', 'C4', 'D1', 'D2', 'D3', 'D4'];
        const currentPatternInSong = this.machine.song.chain[this.machine.song.currentPosition];
        document.getElementById('currentPattern').textContent = labels[currentPatternInSong] + ' (Song)';
      }
    }
  }

  startMetering() {
    const analyser = this.machine.audioContext.createAnalyser();
    this.machine.compressor.connect(analyser);
    analyser.fftSize = 256;
    const dataArray = new Uint8Array(analyser.frequencyBinCount);

    const updateMeter = () => {
      analyser.getByteFrequencyData(dataArray);
      const average = dataArray.reduce((a, b) => a + b) / dataArray.length;
      const percent = (average / 255) * 100;
      document.getElementById('meterFill').style.height = percent + '%';

      if (this.machine.isPlaying) {
        this.updatePlayhead();
      }

      requestAnimationFrame(updateMeter);
    };

    updateMeter();
  }

  render() {
    this.renderChannels();
    this.renderSequencer();
    this.renderPatternBank();
    this.renderSongChain();

    // Update tempo display
    document.getElementById('tempoDisplay').textContent = this.machine.tempo;

    // Update swing controls
    document.getElementById('swingSlider').value = this.machine.swing;
    document.getElementById('swingValue').textContent = this.machine.swing + '%';

    // Update master fader position (100px track - 25px thumb = 75px range)
    const faderValue = this.machine.masterGain.gain.value / 0.8;
    const faderY = (1 - faderValue) * 75;
    document.getElementById('masterFader').style.top = faderY + 'px';

    // Update reverb controls
    document.getElementById('reverbMix').value = this.machine.reverbGain.gain.value * 100;

    // Update delay controls
    document.getElementById('delayMix').value = this.machine.delayMix.gain.value * 100;
    document.getElementById('delayFeedback').value = this.machine.delayFeedback.gain.value * 100;

    // Update compressor controls
    document.getElementById('compressorOn').checked = this.machine.compressorEnabled;
    document.getElementById('compThreshold').value = this.machine.compressorThreshold;
    document.getElementById('compThresholdValue').textContent = this.machine.compressorThreshold + ' dB';
    document.getElementById('compRatio').value = this.machine.compressorRatio;
    document.getElementById('compRatioValue').textContent = this.machine.compressorRatio + ':1';

    // Update current pattern display
    const labels = ['A1', 'A2', 'A3', 'A4', 'B1', 'B2', 'B3', 'B4',
                    'C1', 'C2', 'C3', 'C4', 'D1', 'D2', 'D3', 'D4'];
    document.getElementById('currentPattern').textContent = labels[this.machine.currentPattern];

    // Update mode buttons
    if (this.machine.songMode) {
      document.getElementById('songModeBtn').classList.add('active');
      document.getElementById('patternModeBtn').classList.remove('active');
      document.getElementById('songModeControls').style.display = 'block';
    } else {
      document.getElementById('patternModeBtn').classList.add('active');
      document.getElementById('songModeBtn').classList.remove('active');
      document.getElementById('songModeControls').style.display = 'none';
    }

    // Update song loop checkbox
    document.getElementById('songLoop').checked = this.machine.song.loop;

    // Update solo/mute button states
    this.machine.channels.forEach((channel, idx) => {
      const soloBtn = document.querySelector(`.solo-btn[data-channel="${idx}"]`);
      const muteBtn = document.querySelector(`.mute-btn[data-channel="${idx}"]`);
      if (soloBtn) {
        if (channel.solo) soloBtn.classList.add('active');
        else soloBtn.classList.remove('active');
      }
      if (muteBtn) {
        if (channel.mute) muteBtn.classList.add('active');
        else muteBtn.classList.remove('active');
      }
    });
  }
}

const machine = new DrumMachine();
const ui = new UI(machine);

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (machine.isPlaying) {
      machine.stop();
      document.getElementById('playBtn').classList.remove('playing');
    } else {
      machine.play();
      document.getElementById('playBtn').classList.add('playing');
    }
  }

  // Copy pattern: Ctrl+C or Cmd+C
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyC') {
    e.preventDefault();
    if (machine.copyPattern()) {
      document.getElementById('copyPattern').textContent = 'Copied!';
      setTimeout(() => {
        document.getElementById('copyPattern').textContent = 'Copy';
      }, 1000);
    }
  }

  // Paste pattern: Ctrl+V or Cmd+V
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyV') {
    e.preventDefault();
    if (machine.pastePattern()) {
      ui.renderSequencer();
      document.getElementById('pastePattern').textContent = 'Pasted!';
      setTimeout(() => {
        document.getElementById('pastePattern').textContent = 'Paste';
      }, 1000);
    }
  }
});
</script>
